{% extends "base.html" %}

{% block content %}
<style>
    .carousel-wrapper {
        position: relative;
    }

    .carousel-container {
        overflow: hidden;
        position: relative;
    }

    .carousel-arrow {
        position: absolute;
        top: 30%; /* фиксированная высота */
        z-index: 2;
        width: 32px;
        height: 32px;
        font-size: 1.25rem;
        border: none;
        border-radius: 50%;
        background-color: #0d6efd; /* Bootstrap primary blue */
        color: white;
        display: flex;
        align-items: center;
        justify-content: center;
        opacity: 0.85;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
    }

    .carousel-arrow:hover {
        opacity: 1;
    }

    .carousel-prev {
        left: -40px;
    }

    .carousel-next {
        right: -40px;
    }

    @media (max-width: 768px) {
        .carousel-prev {
            left: -20px;
        }

        .carousel-next {
            right: -20px;
        }

        .carousel-arrow {
            width: 28px;
            height: 28px;
            font-size: 1rem;
        }
    }
</style>

<div class="container my-4">
    <h1 class="text-center mb-4">Пейзажи Марса</h1>

    <div class="carousel-wrapper">
        <!-- Кнопки по бокам, на фиксированной высоте -->
        <button class="carousel-arrow carousel-prev"
                type="button" data-bs-target="#carouselExample" data-bs-slide="prev">
            ‹
        </button>

        <div id="carouselExample" class="carousel slide carousel-container" data-bs-ride="carousel">
            <div class="carousel-inner">
                {% for image in images %}
                <div class="carousel-item {% if loop.index == 1 %}active{% endif %}">
                    <img src="{{ url_for('static', filename=image) }}"
                         class="d-block w-100" alt="Mars photo">
                </div>
                {% endfor %}
            </div>
        </div>

        <button class="carousel-arrow carousel-next"
                type="button" data-bs-target="#carouselExample" data-bs-slide="next">
            ›
        </button>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
{% endblock %}
